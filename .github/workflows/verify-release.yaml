name: Verify release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag to verify
        required: true
        default: master
        type: string

permissions:
  contents: read

jobs:
  tests-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install dependencies
        run: python -m pip install -r requirements_test.txt pyflakes mypy
      - name: Record tested commit
        run: git rev-parse HEAD
      - name: Lint, type check, and test
        run: |
          python -m pyflakes custom_components/healthbox3 tests
          python -m mypy --config-file mypy.ini custom_components/healthbox3
          python -m pytest tests/ -q
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Record tested commit
        run: git rev-parse HEAD
      - uses: home-assistant/actions/hassfest@master
